<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#10243f" />
    <title>내 창업 진행판 · 손세차장</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/workspace.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspaceMain">본문으로 이동</a>
    <div class="demo-banner"><strong>개발 미리보기</strong><span>로그인 준비 전 시험 화면입니다. 실제 개인정보·고객 자료는 입력하지 마세요.</span></div>
    <header class="workspace-header">
      <a class="workspace-brand" href="./workspace.html"><span aria-hidden="true">水</span><strong>손세차장<span>창업 지원 공간</span></strong></a>
      <a class="guide-link" href="./index.html">기존 창업가이드 ↗</a>
      <label class="actor-control">시험 역할<select id="actorSelect" aria-label="시험 역할" disabled></select></label>
    </header>
    <main id="workspaceMain" tabindex="-1">
      <section class="page-intro"><div><p class="eyebrow">START YOUR NEXT CHAPTER</p><h1>내 창업 진행판</h1><p>후보지의 가능성을 살피고, 확인된 내용으로 다음 단계를 준비하세요.</p></div><button class="primary" id="newProjectButton" type="button" hidden>+ 새 창업 사업</button></section>
      <p id="globalStatus" role="status" aria-live="polite"></p>
      <div id="workspaceApp"><div class="empty-state"><h2>진행 내용을 불러오고 있어요</h2><p>저장된 사업과 검토 의뢰를 확인합니다.</p></div></div>
    </main>
    <dialog id="workspaceDialog" aria-labelledby="dialogTitle">
      <header class="dialog-header"><div><p class="eyebrow">MY BUSINESS</p><h2 id="dialogTitle"></h2></div><button type="button" id="closeDialog" class="icon-button" aria-label="창 닫기">×</button></header>
      <div id="dialogBody"></div>
    </dialog>
    <footer class="workspace-footer">사전 검토는 허가 확정이 아닙니다. 최종 판단은 관할 기관과 확인하세요.</footer>
    <script type="module" src="/src/workspace.js"></script>
  </body>
</html>
