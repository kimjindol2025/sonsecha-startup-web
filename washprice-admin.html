<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WashPrice 관리자 페이지입니다." />
    <meta name="theme-color" content="#0d1320" />
    <title>WashPrice · 관리자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/washprice.css" />
  </head>
  <body class="washprice-page">
    <div class="wp-shell">
      <header class="wp-header">
        <a class="wp-brand" href="/washprice.html" aria-label="WashPrice 홈">
          <span>W</span>
          <div>
            <strong>WashPrice</strong>
            <small>관리자</small>
          </div>
        </a>
        <nav class="wp-nav" aria-label="주요 메뉴">
          <a href="/washprice.html">홈으로</a>
          <a href="#dashboard">대시보드</a>
          <a href="#carwashForm">세차장 등록</a>
          <a href="#priceForm">가격 등록</a>
          <a href="#serviceForm">서비스 가격</a>
        </nav>
      </header>

      <main class="wp-main">
        <section class="wp-panel" id="dashboard">
          <div class="wp-section-head">
            <div>
              <p class="wp-kicker">ADMIN DASHBOARD</p>
              <h1>관리자 대시보드</h1>
            </div>
            <p class="wp-section-note">전체 세차장 수, 등록 상태, 최근 30일 확인 현황만 간단히 봅니다.</p>
          </div>
          <div class="wp-summary-grid" id="adminSummary"></div>
          <div class="wp-region-stats" id="adminRegionStats"></div>
        </section>

        <section class="wp-panel">
          <div class="wp-section-head">
            <div>
              <p class="wp-kicker">MANAGE</p>
              <h2>세차장 관리</h2>
            </div>
            <p class="wp-section-note">세차장 등록 후 가격 등록 화면으로 이동합니다.</p>
          </div>
          <div class="wp-admin-layout">
            <aside class="wp-admin-list">
              <div class="wp-admin-search">
                <input id="adminSearch" type="search" placeholder="상호 / 주소 / 지역 검색" />
              </div>
              <div id="carwashTable" class="wp-table-list"></div>
            </aside>

            <div class="wp-admin-panels">
              <form class="wp-form-card" id="carwashForm">
                <div class="wp-form-head">
                  <div>
                    <p class="wp-kicker">CARWASH</p>
                    <h3>세차장 등록 / 수정</h3>
                  </div>
                  <span id="carwashFormState">새 세차장을 등록하세요.</span>
                </div>
                <input type="hidden" name="id" />
                <div class="wp-form-grid">
                  <label class="wp-field"><span>상호</span><input name="name" type="text" required maxlength="120" /></label>
                  <label class="wp-field"><span>전화</span><input name="phone" type="text" required maxlength="40" /></label>
                  <label class="wp-field wp-field-wide"><span>주소</span><input name="address" type="text" required maxlength="200" /></label>
                  <label class="wp-field"><span>시/도</span><input name="sido" type="text" required maxlength="40" /></label>
                  <label class="wp-field"><span>시/군/구</span><input name="sigungu" type="text" required maxlength="60" /></label>
                  <label class="wp-field"><span>동</span><input name="dong" type="text" required maxlength="60" /></label>
                  <label class="wp-field"><span>위도</span><input name="latitude" type="number" step="0.000001" /></label>
                  <label class="wp-field"><span>경도</span><input name="longitude" type="number" step="0.000001" /></label>
                  <label class="wp-check"><input name="open_24h" type="checkbox" /><span>24시간 여부</span></label>
                  <label class="wp-check"><input name="card_available" type="checkbox" /><span>카드 사용 가능</span></label>
                </div>
                <div class="wp-form-actions">
                  <button class="wp-button wp-primary" type="submit">세차장 저장</button>
                  <button class="wp-button wp-secondary" type="button" id="newCarwashButton">새로 작성</button>
                </div>
              </form>

              <form class="wp-form-card" id="priceForm">
                <div class="wp-form-head">
                  <div>
                    <p class="wp-kicker">PRICE</p>
                    <h3>가격 등록 / 수정</h3>
                  </div>
                  <span id="priceFormState">기본가격과 환산가격을 함께 저장합니다.</span>
                </div>
                <div class="wp-preview" id="pricePreview"></div>
                <div class="wp-form-grid">
                  <label class="wp-field"><span>기본요금</span><input name="base_price" type="number" min="0" step="1" required /></label>
                  <label class="wp-field"><span>기본시간(초)</span><input name="base_seconds" type="number" min="1" step="1" required /></label>
                  <label class="wp-field"><span>추가요금</span><input name="extra_price" type="number" min="0" step="1" required /></label>
                  <label class="wp-field"><span>추가시간(초)</span><input name="extra_seconds" type="number" min="1" step="1" required /></label>
                  <label class="wp-field"><span>가격 확인일</span><input name="verified_at" type="date" required /></label>
                  <label class="wp-field wp-field-wide"><span>출처 메모</span><input name="source" type="text" required maxlength="120" /></label>
                </div>
                <div class="wp-form-actions">
                  <button class="wp-button wp-primary" type="submit">가격 저장</button>
                  <button class="wp-button wp-secondary" type="button" id="priceResetButton">현재값 불러오기</button>
                </div>
              </form>

              <form class="wp-form-card" id="serviceForm">
                <div class="wp-form-head">
                  <div>
                    <p class="wp-kicker">SERVICE PRICE</p>
                    <h3>부가서비스 가격</h3>
                  </div>
                  <span id="serviceFormState">값이 없는 항목은 저장하지 않습니다.</span>
                </div>
                <div class="wp-service-grid" id="serviceRows"></div>
                <div class="wp-form-actions">
                  <button class="wp-button wp-primary" type="submit">서비스 가격 저장</button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/washprice-admin.js"></script>
  </body>
</html>
