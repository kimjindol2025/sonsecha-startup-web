name: sonsecha startup web checks

on:
  push:
    branches: [master, feature/candidate-check-notes]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check whitespace
        run: git diff --check
      - name: Build
        run: npm run build
